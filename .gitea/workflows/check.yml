name: Check

on:
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  commit-messages:
    name: Validate commit messages
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check commit message subjects
        shell: bash
        run: ./scripts/check-commit-messages.sh "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}"

  quality:
    name: Go quality and tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # web 包用 //go:embed all:dist：embed 在编译期要求该目录存在且有文件。
      # 质量 job 不构建前端，这里放一个占位文件让所有 go 命令能编译 web 包；
      # 仅用于编译校验，不会进入任何发布产物（发布走 release.yml 的真实构建）。
      - name: Stub web/dist for go:embed
        run: |
          mkdir -p web/dist
          echo '<!doctype html><title>relaywatch embed stub</title>' > web/dist/index.html

      # deadcode 步内存占用大（冷缓存实测峰值 1.2–1.7GB）；若 runner 内存不足被 OOM 杀掉
      # （日志出现 "signal: killed"），给本步加 env: RW_SKIP_DEADCODE: "1" 即可跳过该检查
      # （go vet 与 staticcheck 不受影响）；建议直接把 runner 内存提到 2GB+。
      - name: Run quality gates
        run: ./scripts/check-go-quality.sh

      # -race 测试同样吃内存（实测约 1.0GB）：限制包级并行 + GOGC/GOMEMLIMIT 压峰值
      - name: Run tests
        env:
          GOGC: "50"
          GOMEMLIMIT: "800MiB"
        run: go test -race -p 2 -coverprofile=coverage.txt -covermode=atomic ./...

      - name: Check for vulnerabilities
        run: go tool govulncheck ./...

      # 占位 dist 已就绪，走真实 go:embed 路径编译（带 -tags dev 会跳过嵌入，故不再使用）
      - name: Verify build
        run: go build -trimpath -ldflags="-s -w" -o /tmp/relaywatch-build-check ./cmd/relaywatch

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      # 不用 pnpm/action-setup：Forgejo runner 对 action 改 PATH 的传递不可靠，
      # setup-node 的 cache: pnpm（运行期要调用 pnpm store path）与后续 run 步骤
      # 都会报 "Unable to locate executable file: pnpm"。
      # 改为装进 node 自身的 bin 目录（npm 所在目录），后续步骤必然可见。
      - name: Set up pnpm
        run: |
          npm install -g pnpm@12.15.0
          pnpm --version

      - name: Install dependencies
        working-directory: web
        run: pnpm install --frozen-lockfile

      - name: Run tests
        working-directory: web
        run: pnpm test

      - name: Build
        working-directory: web
        run: pnpm build
