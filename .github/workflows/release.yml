name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.15.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y zstd

      - name: Build frontend (go:embed 打包进二进制)
        working-directory: web
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      - name: Build Linux amd64
        run: CGO_ENABLED=0 go build -trimpath -ldflags="-s -w -X main.release=${{ github.ref_name }}" -o relaywatch-linux-amd64 ./cmd/relaywatch

      - name: Build Linux arm64
        env:
          GOOS: linux
          GOARCH: arm64
          CGO_ENABLED: "0"
        run: go build -trimpath -ldflags="-s -w -X main.release=${{ github.ref_name }}" -o relaywatch-linux-arm64 ./cmd/relaywatch

      - name: Package Arch Linux
        run: |
          VERSION="${{ github.ref_name }}"
          # pacman 的 pkgver 不允许连字符/空白：v1.0.0-rc1 这类 tag 不能直接做 pkgver
          PKGVER="${VERSION#v}"
          if [[ ! "$PKGVER" =~ ^[0-9A-Za-z._+]+$ ]]; then
            echo "tag ${VERSION} 无法转换为 Arch pkgver（仅允许字母数字与 . _ +），请改用 v1.0.0 形式的 tag" >&2
            exit 1
          fi
          PKGROOT="relaywatch-arch-pkg"
          mkdir -p "${PKGROOT}/usr/bin"
          mkdir -p "${PKGROOT}/etc/relaywatch"
          mkdir -p "${PKGROOT}/usr/lib/systemd/system"
          mkdir -p "${PKGROOT}/usr/lib/sysusers.d"
          mkdir -p "${PKGROOT}/usr/lib/tmpfiles.d"
          mkdir -p "${PKGROOT}/usr/share/doc/relaywatch"

          cp relaywatch-linux-amd64 "${PKGROOT}/usr/bin/relaywatch"
          # 打包仓库中的示例配置为 /etc/relaywatch/config.yaml（.PKGINFO 标了 backup，升级不覆盖用户修改）
          cp config.example.yaml "${PKGROOT}/etc/relaywatch/config.yaml"
          cp packaging/arch/env "${PKGROOT}/etc/relaywatch/env"
          chmod 600 "${PKGROOT}/etc/relaywatch/env"
          cp packaging/arch/relaywatch.service "${PKGROOT}/usr/lib/systemd/system/relaywatch.service"
          cp packaging/arch/relaywatch.sysusers "${PKGROOT}/usr/lib/sysusers.d/relaywatch.conf"
          cp packaging/arch/relaywatch.tmpfiles "${PKGROOT}/usr/lib/tmpfiles.d/relaywatch.conf"
          cp README.md "${PKGROOT}/usr/share/doc/relaywatch/README.md"

          cat > "${PKGROOT}/.PKGINFO" << PKGEOF
          pkgname = relaywatch
          pkgver = ${PKGVER}-1
          pkgdesc = Self-hosted version update monitoring service
          url = https://github.com/xmengnet/relaywatch
          packager = liyp <my@liyp.cc>
          arch = x86_64
          depend = ca-certificates
          depend = tzdata
          backup = etc/relaywatch/config.yaml
          backup = etc/relaywatch/env
          PKGEOF

          cd "${PKGROOT}"
          SIZE=$(find .PKGINFO etc usr -type f -printf '%s\n' | awk '{s+=$1} END {print s}')
          echo "size = ${SIZE}" >> .PKGINFO
          tar -c --zstd -f "../relaywatch-${PKGVER}-1-x86_64.pkg.tar.zst" .PKGINFO etc usr
          cd ..
          rm -rf "${PKGROOT}"

      - name: Package Debian (amd64 + arm64)
        run: |
          VERSION="${{ github.ref_name }}"
          PKGVER="${VERSION#v}"
          if [[ ! "$PKGVER" =~ ^[0-9A-Za-z._+]+$ ]]; then
            echo "tag ${VERSION} 无法转换为 Debian 包版本号，请改用 v1.0.0 形式的 tag" >&2
            exit 1
          fi

          # 与 Arch 打包同构的目录树；systemd unit / sysusers / tmpfiles / env 直接复用 packaging/arch
          build_deb() {
            local arch="$1" binary="$2"
            local PKGROOT="relaywatch-deb-pkg"
            rm -rf "${PKGROOT}"
            install -d "${PKGROOT}"/usr/bin "${PKGROOT}"/etc/relaywatch \
                      "${PKGROOT}"/usr/lib/systemd/system "${PKGROOT}"/usr/lib/sysusers.d \
                      "${PKGROOT}"/usr/lib/tmpfiles.d "${PKGROOT}"/usr/share/doc/relaywatch \
                      "${PKGROOT}"/DEBIAN

            install -m 755 "${binary}" "${PKGROOT}/usr/bin/relaywatch"
            install -m 644 config.example.yaml "${PKGROOT}/etc/relaywatch/config.yaml"
            install -m 600 packaging/arch/env "${PKGROOT}/etc/relaywatch/env"
            install -m 644 packaging/arch/relaywatch.service "${PKGROOT}/usr/lib/systemd/system/relaywatch.service"
            install -m 644 packaging/arch/relaywatch.sysusers "${PKGROOT}/usr/lib/sysusers.d/relaywatch.conf"
            install -m 644 packaging/arch/relaywatch.tmpfiles "${PKGROOT}/usr/lib/tmpfiles.d/relaywatch.conf"
            install -m 644 README.md "${PKGROOT}/usr/share/doc/relaywatch/README.md"

            # control 模板：版本号 / 架构 / Installed-Size（KiB，dpkg 惯例）
            sed -e "s/__VERSION__/${PKGVER}/" \
                -e "s/__ARCH__/${arch}/" \
                -e "s/__INSTALLED_SIZE__/$(du -sk "${PKGROOT}/usr" | awk '{print $1}')/" \
                packaging/deb/control > "${PKGROOT}/DEBIAN/control"
            install -m 644 packaging/deb/conffiles "${PKGROOT}/DEBIAN/conffiles"
            install -m 755 packaging/deb/postinst "${PKGROOT}/DEBIAN/postinst"
            install -m 755 packaging/deb/prerm "${PKGROOT}/DEBIAN/prerm"

            # --root-owner-group：CI 下无需 root 也能写出正确的 root 归属
            dpkg-deb --root-owner-group --build "${PKGROOT}" \
              "relaywatch_${PKGVER}-1_${arch}.deb"
            rm -rf "${PKGROOT}"
          }

          build_deb amd64 relaywatch-linux-amd64
          build_deb arm64 relaywatch-linux-arm64

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: |
            relaywatch-linux-amd64
            relaywatch-linux-arm64
            relaywatch-*-1-x86_64.pkg.tar.zst
            relaywatch_*-1_amd64.deb
            relaywatch_*-1_arm64.deb
          if-no-files-found: error

  create-release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      # ${VERSION#v} 是 bash 语法，只在 run 的 shell 里求值；
      # body 直接传给 release action，必须先用表达式算好再插入
      - name: Compute version
        id: ver
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: RelayWatch ${{ github.ref_name }}
          body: |
            ## RelayWatch ${{ github.ref_name }}

            ### 下载

            | 平台 | 架构 | 下载链接 |
            |------|------|----------|
            | Linux | amd64 | [relaywatch-linux-amd64](${{ github.server_url }}/${{ github.repository }}/releases/download/${{ github.ref_name }}/relaywatch-linux-amd64) |
            | Linux | arm64 | [relaywatch-linux-arm64](${{ github.server_url }}/${{ github.repository }}/releases/download/${{ github.ref_name }}/relaywatch-linux-arm64) |
            | Linux (Arch) | x86_64 | [relaywatch-${{ steps.ver.outputs.version }}-1-x86_64.pkg.tar.zst](${{ github.server_url }}/${{ github.repository }}/releases/download/${{ github.ref_name }}/relaywatch-${{ steps.ver.outputs.version }}-1-x86_64.pkg.tar.zst) |
            | Linux (Debian) | amd64 | [relaywatch_${{ steps.ver.outputs.version }}-1_amd64.deb](${{ github.server_url }}/${{ github.repository }}/releases/download/${{ github.ref_name }}/relaywatch_${{ steps.ver.outputs.version }}-1_amd64.deb) |
            | Linux (Debian) | arm64 | [relaywatch_${{ steps.ver.outputs.version }}-1_arm64.deb](${{ github.server_url }}/${{ github.repository }}/releases/download/${{ github.ref_name }}/relaywatch_${{ steps.ver.outputs.version }}-1_arm64.deb) |

            ### 快速使用

            ```bash
            # Linux（二进制，前端已内嵌，运行时零依赖）
            chmod +x relaywatch-linux-amd64
            ./relaywatch-linux-amd64 -version

            # 首次部署：cp config.example.yaml config.yaml 并填 security.secret_key
            ./relaywatch-linux-amd64 -config config.yaml

            # Arch Linux
            sudo pacman -U relaywatch-${{ steps.ver.outputs.version }}-1-x86_64.pkg.tar.zst
            openssl rand -base64 32   # 写入 /etc/relaywatch/env 的 RELAYWATCH_SECRET_KEY
            sudo systemctl enable --now relaywatch

            # Debian / Ubuntu
            sudo dpkg -i relaywatch_${{ steps.ver.outputs.version }}-1_amd64.deb
            openssl rand -base64 32   # 写入 /etc/relaywatch/env 的 RELAYWATCH_SECRET_KEY
            sudo systemctl enable --now relaywatch
            ```

            完整部署说明（Docker / systemd / 反向代理 / 备份）见仓库 `docs/deploy.md`。
          files: |
            dist/relaywatch-linux-amd64
            dist/relaywatch-linux-arm64
            dist/relaywatch-*-1-x86_64.pkg.tar.zst
            dist/relaywatch_*-1_amd64.deb
            dist/relaywatch_*-1_arm64.deb
          fail_on_unmatched_files: true
