name: Check

on:
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  commit-messages:
    name: Validate commit messages
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check commit message subjects
        shell: bash
        run: ./scripts/check-commit-messages.sh "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}"

  quality:
    name: Go quality and tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      # web 包用 //go:embed all:dist：embed 在编译期要求该目录存在且有文件。
      # 质量 job 不构建前端，这里放一个占位文件让所有 go 命令能编译 web 包；
      # 仅用于编译校验，不会进入任何发布产物（发布走 release.yml 的真实构建）。
      - name: Stub web/dist for go:embed
        run: |
          mkdir -p web/dist
          echo '<!doctype html><title>relaywatch embed stub</title>' > web/dist/index.html

      - name: Run quality gates
        run: ./scripts/check-go-quality.sh

      - name: Run tests
        run: go test -race -coverprofile=coverage.txt -covermode=atomic ./...

      - name: Check for vulnerabilities
        run: go tool govulncheck ./...

      # 占位 dist 已就绪，走真实 go:embed 路径编译
      - name: Verify build
        run: go build -trimpath -ldflags="-s -w" -o /tmp/relaywatch-build-check ./cmd/relaywatch

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 版本与 web/package.json 的 packageManager 字段保持一致
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.15.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: web
        run: pnpm install --frozen-lockfile

      - name: Run tests
        working-directory: web
        run: pnpm test

      - name: Build
        working-directory: web
        run: pnpm build
